# CommonsenseQA in cloze form: each answer's text is scored as the
# continuation. lm-eval's commonsense_qa scores the letters A to E instead,
# which small models cannot use and whose gold BPB measures a single letter.
task: commonsense_qa_cloze
dataset_path: tau/commonsense_qa
output_type: multiple_choice
training_split: train
validation_split: validation
doc_to_text: "Question: {{question.strip()}}\nAnswer:"
doc_to_choice: "{{choices['text']}}"
doc_to_target: "{{choices['label'].index(answerKey)}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0
