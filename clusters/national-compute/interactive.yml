apiVersion: batch/v1
kind: Job
metadata:
  name: interactive-gpu
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      containers:
        - name: shell
          image: rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.14.0
          workingDir: /mnt/shared/mayank/trainstation
          command: ["/bin/bash", "-lc"]
          args:
            pip install tyro spmd-types grain datasets tokenizers renderers tensorboard torch-remat
            - |
              set -euxo pipefail
              python3 -m pip install --no-cache-dir -r requirements.txt
              python3 -m pip install --no-cache-dir 'torch_checkpointing>=0.1.0'
              python3 -c "import torch, torchvision, torchaudio, tyro, torch_checkpointing; print('runtime dependencies verified')"
              exec sleep infinity
          stdin: true
          tty: true
          resources:
            requests:
              # National Compute admits GPU workloads only as full nodes.
              amd.com/gpu: 8
            limits:
              amd.com/gpu: 8
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: shared
              mountPath: /mnt/shared
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
        - name: shared
          hostPath:
            path: /mnt/shared
            type: Directory
